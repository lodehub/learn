<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths Week 2: Brackets, equations, and checking</title>
<style>
:root{
  --ink:#1e2430; --muted:#586070; --bg:#f5f6f8; --panel:#ffffff; --line:#d9dce3;
  --accent:#3a4fb5; --accent-soft:#e6e9f8;
  --ok:#25664a; --ok-soft:#e1f1e9; --bad:#a4470b; --bad-soft:#fbeadb;
}
@media (prefers-color-scheme:dark){
  :root{ --ink:#e8eaf0; --muted:#a2a9b8; --bg:#14171e; --panel:#1d212b; --line:#333949;
  --accent:#9fb0ff; --accent-soft:#222845;
  --ok:#7fd1a8; --ok-soft:#1b3328; --bad:#f0a56a; --bad-soft:#3a2a1b; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:1.45rem;line-height:1.25;margin:.2em 0 .3em;color:var(--accent)}
h2{font-size:1.15rem;margin:.2em 0 .4em}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px;margin:14px 0}
.lead{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.lead .ln{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem}
.q{font-weight:600;margin:6px 0 8px}
.bar{display:flex;gap:6px;margin:6px 0 4px}
.bar span{flex:1;height:7px;border-radius:4px;background:var(--line)}
.bar span.on{background:var(--accent)}
.bar span.done{background:var(--ok)}
.stepname{font-size:.85rem;color:var(--muted);margin-bottom:8px}
button{font:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:7px 0}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:8px 0 2px;padding:9px 12px;border-radius:10px;font-size:.96rem}
.fb.ok{background:var(--ok-soft);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-soft);border-left:4px solid var(--bad)}
.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:600}
@media (prefers-color-scheme:dark){.primary{color:#111}}
.primary[disabled]{opacity:.4;cursor:default}
.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);border-radius:10px;padding:8px 14px}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;font-size:.95rem}
.chip.used{opacity:.35}
.seq{counter-reset:s;margin:8px 0;padding:0;list-style:none}
.seq li{counter-increment:s;background:var(--ok-soft);border-left:4px solid var(--ok);border-radius:8px;padding:7px 10px;margin:5px 0}
.seq li::before{content:counter(s) ". ";font-weight:700}
.starters{font-size:.92rem;color:var(--muted);margin:2px 0 8px}
.model{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.field{display:flex;gap:8px;align-items:center;margin:6px 0}
.field label{min-width:90px;font-weight:600}
.checks label{display:block;margin:6px 0}
.small{font-size:.88rem;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.hide{display:none}
pre.res{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.88rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const C = {"title": "Maths Week 2: Brackets, equations, and checking", "subtitle": "Skill of the week: <strong>written method and checking<\/strong>, same as last week, now with brackets. About 20 minutes on screen, then the paper sheet.", "accent": "#3a4fb5", "accentSoft": "#e6e9f8", "accentDark": "#9fb0ff", "accentSoftDark": "#222845", "storageKey": "ember:maths:week2-brackets:result", "intro": "<p>Paper and pencil next to you. Last week you learned to <strong>check<\/strong> an answer by putting x back in. This week the equations contain <strong>brackets<\/strong>, and brackets are where marks are lost: a sign is dropped, or only the first term gets multiplied.<\/p><p>The rule: <strong>the number outside multiplies everything inside<\/strong>, including its sign. Example: &minus;3(x &minus; 4) = &minus;3x <strong>+ 12<\/strong>, because &minus;3 &times; &minus;4 = +12.<\/p><p>Type answers like <em>3x+12<\/em> or <em>-4x+12<\/em> (no spaces needed).<\/p>", "startLabel": "Start the warm-up", "note": "I could not see the school's maths plan or this week's Sparx topics. Brackets follow equations in most Year 8 plans. If Sparx is on something else, tell me the topic and I will realign this.", "doneHeading": "Done. Now the paper sheet.", "afterDone": "Next: the written questions on paper (20 to 30 min), with a check for every answer and an error log, then the oral check with a parent.", "steps": [{"name": "Warm-up", "type": "solve", "heading": "Last week's skill, cold (5 min)", "intro": "Solve, then do the check: put your x back into the <strong>left side<\/strong> and type what you get. It should equal the right side.", "next": "Next: expanding brackets", "items": [{"q": "4x &minus; 7 = 21", "fields": [{"label": "x =", "ans": ["7", "x=7"]}, {"label": "Left side", "ans": ["21"]}], "f": "4(7) &minus; 7 = 28 &minus; 7 = 21, which matches.", "hint": "Add 7 to both sides first, then divide by 4."}, {"q": "5x + 3 = 3x + 17", "fields": [{"label": "x =", "ans": ["7", "x=7"]}, {"label": "Left side", "ans": ["38"]}], "f": "5(7) + 3 = 38, and 3(7) + 17 = 38. Both sides match.", "hint": "Take 3x from both sides first."}, {"q": "2(x + 4) = 18", "fields": [{"label": "x =", "ans": ["5", "x=5"]}, {"label": "Left side", "ans": ["18"]}], "f": "2(5 + 4) = 2 &times; 9 = 18.", "hint": "Divide both sides by 2 first, or expand the bracket."}]}, {"name": "Expand", "type": "solve", "heading": "Expand and simplify (5 min)", "intro": "Multiply out the brackets, then collect like terms. Watch the signs.", "next": "Next: spot the error", "items": [{"q": "Expand 3(x + 4)", "fields": [{"label": "Answer", "ans": ["3x+12", "12+3x"]}], "f": "3 &times; x = 3x and 3 &times; 4 = 12."}, {"q": "Expand 2(3x &minus; 5)", "fields": [{"label": "Answer", "ans": ["6x-10", "-10+6x"]}], "f": "2 &times; 3x = 6x and 2 &times; (&minus;5) = &minus;10."}, {"q": "Expand &minus;4(x &minus; 3)", "fields": [{"label": "Answer", "ans": ["-4x+12", "12-4x"]}], "f": "&minus;4 &times; x = &minus;4x, and &minus;4 &times; &minus;3 = <strong>+12<\/strong>."}, {"q": "Expand and simplify 3(x + 2) + 2(x &minus; 1)", "fields": [{"label": "Answer", "ans": ["5x+4", "4+5x"]}], "f": "3x + 6 + 2x &minus; 2 = 5x + 4."}, {"q": "Expand and simplify 4(2x &minus; 1) &minus; 3(x + 2)", "fields": [{"label": "Answer", "ans": ["5x-10", "-10+5x"]}], "f": "8x &minus; 4 &minus; 3x &minus; 6 = 5x &minus; 10. The &minus;3 multiplies <em>both<\/em> terms.", "hint": "Be careful: &minus;3 multiplies the 2 as well as the x."}]}, {"name": "Spot the error", "type": "mcq", "heading": "Find the first wrong line", "intro": "Each worked solution may contain a mistake. Find the <strong>first<\/strong> line that is wrong, or say there is none.", "next": "Next: solve and check", "items": [{"lead": "<span class='ln'>Line 1: 5(x &minus; 2)<\/span><span class='ln'>Line 2: = 5x &minus; 2<\/span>", "q": "Where does the first mistake appear?", "o": ["Line 2", "No mistake"], "a": 0, "f": "Line 2. The 5 must multiply the &minus;2 too: 5x &minus; 10."}, {"lead": "<span class='ln'>Line 1: &minus;3(x &minus; 4)<\/span><span class='ln'>Line 2: = &minus;3x &minus; 12<\/span>", "q": "Where does the first mistake appear?", "o": ["Line 2", "No mistake"], "a": 0, "f": "Line 2. &minus;3 &times; &minus;4 = +12, so the answer is &minus;3x + 12."}, {"lead": "<span class='ln'>Line 1: 2(x + 3) + 4(x &minus; 1)<\/span><span class='ln'>Line 2: = 2x + 6 + 4x &minus; 4<\/span><span class='ln'>Line 3: = 6x + 10<\/span>", "q": "Where does the first mistake appear?", "o": ["Line 2", "Line 3", "No mistake"], "a": 1, "f": "Line 3. +6 &minus; 4 = +2, so the answer is 6x + 2. Line 2 is correct."}, {"lead": "<span class='ln'>Line 1: 3(2x + 1)<\/span><span class='ln'>Line 2: = 6x + 3<\/span>", "q": "Where does the first mistake appear?", "o": ["Line 2", "No mistake"], "a": 1, "f": "There is no mistake. Not every worked solution is wrong, so check before you cross anything out."}]}, {"name": "Solve and check", "type": "solve", "heading": "Solve with brackets, then check (7 min)", "intro": "Do the working on paper. Type x, then the left side with your x in it.", "next": "Finish", "items": [{"q": "3(x + 2) = 21", "fields": [{"label": "x =", "ans": ["5", "x=5"]}, {"label": "Left side", "ans": ["21"]}], "f": "3(5 + 2) = 21.", "hint": "Either divide by 3 first, or expand."}, {"q": "2(x &minus; 3) = x + 4", "fields": [{"label": "x =", "ans": ["10", "x=10"]}, {"label": "Left side", "ans": ["14"]}], "f": "Left: 2(10 &minus; 3) = 14. Right: 10 + 4 = 14. They match.", "hint": "Expand first: 2x &minus; 6 = x + 4."}, {"q": "4(x + 1) = 2(x + 7)", "fields": [{"label": "x =", "ans": ["5", "x=5"]}, {"label": "Left side", "ans": ["24"]}], "f": "Left: 4(6) = 24. Right: 2(12) = 24.", "hint": "Expand both sides, then collect the x terms."}, {"q": "3(2x &minus; 1) &minus; 2x = 13", "fields": [{"label": "x =", "ans": ["4", "x=4"]}, {"label": "Left side", "ans": ["13"]}], "f": "3(7) &minus; 8 = 21 &minus; 8 = 13.", "hint": "Expand, collect 6x &minus; 2x, then solve."}]}]};
const app = document.getElementById('app');
const KEY = C.storageKey;
let state = {step:-1, results:{}};          // results[stepIdx] = {score,total,notes:[]}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({done:state.step>=C.steps.length, results:state.results, t:Date.now()})); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function norm(s){ return String(s).toLowerCase().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/,/g,''); }

function bar(){
  let h='<div class="bar">';
  C.steps.forEach((s,i)=>{ h+='<span class="'+(i<state.step?'done':(i===state.step?'on':''))+'"></span>'; });
  return h+'</div>';
}

function renderIntro(){
  app.innerHTML='<h1>'+C.title+'</h1><p class="sub">'+C.subtitle+'</p><div class="card">'+C.intro+
   '<div class="row"><button class="primary" id="go">'+C.startLabel+'</button></div></div>'+
   (C.note?'<p class="small">'+C.note+'</p>':'');
  document.getElementById('go').onclick=()=>{state.step=0;renderStep();};
}

function renderStep(){
  if(state.step>=C.steps.length){ return renderDone(); }
  const S=C.steps[state.step];
  app.innerHTML=bar()+'<div class="stepname">Part '+(state.step+1)+' of '+C.steps.length+' · '+S.name+'</div><h2>'+S.heading+'</h2>'+(S.intro?'<p>'+S.intro+'</p>':'')+'<div id="items"></div>'+
   '<div class="nav"><span></span><button class="primary" id="next" disabled>'+(S.next||'Next')+'</button></div>';
  const res={score:0,total:0,notes:[]}; state.results[state.step]=res;
  const need=S.items.length; let answered=0;
  const nextBtn=document.getElementById('next');
  function itemDone(){ answered++; if(answered>=need){ nextBtn.disabled=false; save(); } }
  nextBtn.onclick=()=>{ state.step++; save(); renderStep(); window.scrollTo(0,0); };
  const box=document.getElementById('items');
  S.items.forEach((it,idx)=>{
    const card=document.createElement('div'); card.className='card'; box.appendChild(card);
    if(it.lead) { const l=document.createElement('div'); l.className='lead'; l.innerHTML=it.lead; card.appendChild(l); }
    const q=document.createElement('div'); q.className='q'; q.innerHTML=(idx+1)+'. '+it.q; card.appendChild(q);
    ({mcq:mkMcq,order:mkOrder,write:mkWrite,solve:mkSolve})[S.type](card,it,res,itemDone,idx);
  });
}

function mkMcq(card,it,res,done,idx){
  res.total++; const wrap=document.createElement('div'); card.appendChild(wrap);
  const fb=document.createElement('div'); let locked=false;
  it.o.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.innerHTML=o; wrap.appendChild(b);
    b.onclick=()=>{ if(locked) return; locked=true;
      const ok=(i===it.a); if(ok) res.score++; else res.notes.push('Q'+(idx+1)+' chose "'+b.textContent.slice(0,60)+'"');
      [...wrap.children].forEach((x,j)=>{ x.disabled=true; if(j===it.a) x.classList.add('right'); else if(j===i) x.classList.add('wrong'); });
      fb.className='fb '+(ok?'ok':'no'); fb.innerHTML=(ok?'<strong>Yes.</strong> ':'<strong>Not quite.</strong> ')+it.f; card.appendChild(fb); done(); };
  });
}

function mkOrder(card,it,res,done,idx){
  res.total++; const correct=it.items; let pool=shuffle(correct); if(pool.join()===correct.join()) pool=pool.reverse();
  const seq=document.createElement('ol'); seq.className='seq'; const chips=document.createElement('div'); chips.className='chips';
  const fb=document.createElement('div'); let pos=0, slips=0;
  card.appendChild(seq); card.appendChild(chips);
  pool.forEach(t=>{
    const c=document.createElement('button'); c.className='chip'; c.innerHTML=t; chips.appendChild(c);
    c.onclick=()=>{ if(c.classList.contains('used')) return;
      if(t===correct[pos]){ const li=document.createElement('li'); li.innerHTML=t; seq.appendChild(li); c.classList.add('used'); pos++;
        if(pos===correct.length){ if(slips===0) res.score++; else res.notes.push('Q'+(idx+1)+' order needed '+slips+' retries');
          fb.className='fb ok'; fb.innerHTML='<strong>Chain complete.</strong> '+it.f; card.appendChild(fb); done(); } }
      else { slips++; c.style.borderColor='var(--bad)'; setTimeout(()=>c.style.borderColor='',500); }
    };
  });
  const hint=document.createElement('div'); hint.className='small'; hint.textContent='Tap the links in the order they happen. First link first.'; card.appendChild(hint);
}

function mkSolve(card,it,res,done,idx){
  res.total++; let tries=0; const inputs=[];
  if(it.helper){ const h=document.createElement('div'); h.className='small'; h.innerHTML=it.helper; card.appendChild(h); }
  it.fields.forEach(f=>{ const d=document.createElement('div'); d.className='field'; d.innerHTML='<label>'+f.label+'</label>'; const i=document.createElement('input'); i.type='text'; i.autocomplete='off'; i.inputMode='text'; d.appendChild(i); card.appendChild(d); inputs.push(i); });
  const row=document.createElement('div'); row.className='row'; const b=document.createElement('button'); b.className='ghost'; b.textContent='Check'; row.appendChild(b); card.appendChild(row);
  const fb=document.createElement('div'); card.appendChild(fb); let finished=false;
  b.onclick=()=>{ if(finished) return; tries++;
    const ok=it.fields.every((f,k)=>f.ans.some(a=>norm(a)===norm(inputs[k].value)));
    if(ok){ finished=true; if(tries===1) res.score++; else res.notes.push('Q'+(idx+1)+' needed '+tries+' tries'); fb.className='fb ok'; fb.innerHTML='<strong>Correct.</strong> '+it.f; inputs.forEach(i=>i.disabled=true); b.disabled=true; done(); }
    else if(tries>=2){ finished=true; res.notes.push('Q'+(idx+1)+' not solved'); fb.className='fb no'; fb.innerHTML='<strong>Not yet.</strong> Answer: '+it.fields.map(f=>f.label+(/=\s*$/.test(f.label)?' ':' = ')+f.ans[0]).join(', ')+'. '+it.f; inputs.forEach(i=>i.disabled=true); b.disabled=true; done(); }
    else { fb.className='fb no'; fb.innerHTML='Not quite. '+(it.hint||'Look at your working and try once more.'); } };
}

function mkWrite(card,it,res,done,idx){
  if(it.starters){ const s=document.createElement('div'); s.className='starters'; s.innerHTML='Starters you can use: '+it.starters.join(' · '); card.appendChild(s); }
  const ta=document.createElement('textarea'); ta.placeholder=it.placeholder||'Type your answer here…'; card.appendChild(ta);
  const row=document.createElement('div'); row.className='row'; const b=document.createElement('button'); b.className='ghost'; b.textContent='I\u2019ve written it. Show me the checks'; row.appendChild(b); card.appendChild(row);
  const out=document.createElement('div'); card.appendChild(out); let shown=false;
  b.onclick=()=>{ if(shown) return; const words=ta.value.trim().split(/\s+/).filter(Boolean).length;
    if(words<(it.min||8)){ out.innerHTML='<div class="fb no">Write a little more first (about '+(it.min||8)+' words or more). Your own attempt matters more than the model.</div>'; return; }
    shown=true; ta.disabled=true; b.disabled=true;
    let h='<div class="model"><strong>A model, to compare (not to copy):</strong><br>'+it.model+'</div><div class="checks"><strong>Check your own sentence:</strong>';
    (it.check||[]).forEach((c,k)=>{ h+='<label><input type="checkbox" data-k="'+k+'"> '+c+'</label>'; });
    h+='</div><div class="row"><button class="primary" id="sd'+idx+'">Done with this one</button></div>';
    out.innerHTML=h;
    document.getElementById('sd'+idx).onclick=function(){ const ticks=[...out.querySelectorAll('input:checked')].length; res.notes.push('Q'+(idx+1)+' self-check '+ticks+'/'+(it.check||[]).length+'; my answer: '+ta.value.trim().replace(/\s+/g,' ').slice(0,400)); this.disabled=true; done(); };
  };
}

function renderDone(){
  let tot=0,sc=0, lines=[];
  C.steps.forEach((S,i)=>{ const r=state.results[i]||{score:0,total:0,notes:[]}; tot+=r.total; sc+=r.score;
    lines.push(S.name+': '+(r.total?(r.score+'/'+r.total):'written')+(r.notes.length?'\n  - '+r.notes.join('\n  - '):'')); });
  const txt=C.title+'\nScore: '+sc+'/'+tot+'\n'+lines.join('\n');
  app.innerHTML=bar()+'<h1>'+C.doneHeading+'</h1><div class="card"><p><strong>Score on the checked questions: '+sc+' / '+tot+'.</strong> Written answers are marked by you, not by the page.</p><p>'+C.afterDone+'</p>'+
   '<div class="row"><button class="ghost" id="cp">Copy my results</button><button class="ghost" id="rs">Start again</button></div>'+
   '<p class="small">“Copy my results” makes a short summary to paste to Claude for the weekly review. Nothing is sent anywhere automatically.</p><pre class="res hide" id="rt"></pre></div>';
  document.getElementById('cp').onclick=()=>{ const p=document.getElementById('rt'); p.textContent=txt; p.classList.remove('hide'); try{ navigator.clipboard.writeText(txt); }catch(e){} };
  document.getElementById('rs').onclick=()=>{ state={step:-1,results:{}}; renderIntro(); };
  save();
}
renderIntro();
</script>
<script src="../../../assets/back.js"></script>
</body>
</html>
