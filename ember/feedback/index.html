<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6f1">
<title>My feedback</title>
<style>
:root{--bg:#fbf6f1;--card:#ffffff;--ink:#2b2a28;--mute:#6f6b64;--acc:#d9682a;--accsoft:#fdeee4;--line:#e4dcd2;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1b1a;--card:#272624;--ink:#f1eee9;--mute:#aaa49b;--acc:#f0935a;--accsoft:#3a2a20;--line:#3a3835;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1b1a;--card:#272624;--ink:#f1eee9;--mute:#aaa49b;--acc:#f0935a;--accsoft:#3a2a20;--line:#3a3835;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(90px,env(safe-area-inset-bottom))}
header{padding-left:56px;min-height:48px}
@media (max-width:699px){header{padding-left:0}}
.kick{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:0}
h1{font-size:clamp(26px,6vw,34px);margin:2px 0 6px;line-height:1.2}
.lede{color:var(--mute);margin:0 0 16px}
p{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px}
.card h2{font-size:20px;margin:0 0 4px;line-height:1.3}
.meta{font-size:14px;color:var(--mute);margin:0 0 10px}
.new{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--acc);color:#fff;border-radius:999px;padding:2px 9px;margin-left:6px;vertical-align:3px}
.item{background:var(--accsoft);border-left:5px solid var(--acc);border-radius:12px;padding:10px 14px;margin:10px 0 0}
.item .q{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.item p:last-child{margin-bottom:0}
.model{font-style:italic}
.next{border-top:1px dashed var(--line);padding-top:10px;margin-top:12px}
a.btn{display:inline-flex;align-items:center;min-height:44px;margin-top:10px;padding:8px 16px;border-radius:12px;border:1px solid var(--acc);color:var(--acc);font-weight:700;text-decoration:none}
.empty{color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <p class="kick">Your work, read and marked</p>
  <h1>My feedback</h1>
  <p class="lede">Newest first. Read the "next step" for each one: that's the one thing to do.</p>
</header>
<div id="list"><p class="empty">Loading…</p></div>
</div>
<script>
"use strict";
(function(){
var KEY="ember:feedback:seen";
var seen={};try{seen=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
fetch("feedback.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(F){
  var L=document.getElementById("list"),es=(F.entries||[]).slice().sort(function(a,b){return a.date<b.date?1:-1});
  if(!es.length){L.innerHTML='<p class="empty">No feedback yet. It will appear here after your work has been marked.</p>';return}
  L.innerHTML=es.map(function(e){
    var isNew=!seen[e.id];
    return '<section class="card"><h2>'+esc(e.title)+(isNew?'<span class="new">New</span>':'')+'</h2>'+
      '<p class="meta">'+esc(e.date)+(e.subject?' · '+esc(e.subject):'')+(e.mark?' · '+esc(e.mark):'')+'</p>'+
      (e.summary?'<p>'+e.summary+'</p>':'')+
      (e.items||[]).map(function(it){return '<div class="item">'+(it.q?'<p class="q">'+esc(it.q)+(it.mark?' · '+esc(it.mark):'')+'</p>':'')+
        (it.good?'<p><b>What worked:</b> '+it.good+'</p>':'')+(it.fix?'<p><b>To fix:</b> '+it.fix+'</p>':'')+(it.model?'<p class="model"><b>A model sentence:</b> '+it.model+'</p>':'')+'</div>'}).join("")+
      (e.next?'<p class="next"><b>Your next step:</b> '+e.next+'</p>':'')+
      (e.tool?'<a class="btn" href="../'+esc(e.tool)+'">Open the page →</a>':'')+'</section>';
  }).join("");
  es.forEach(function(e){seen[e.id]=1});try{localStorage.setItem(KEY,JSON.stringify(seen))}catch(e){}
}).catch(function(){document.getElementById("list").innerHTML='<p class="empty">Could not load feedback. Check your connection.</p>'});
})();
</script>
<script src="../../assets/back.js"></script>
</body>
</html>
